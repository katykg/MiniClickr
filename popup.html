<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px 0;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
    .support {
      margin-top: 10px;
      font-size: 11px;
      color: #8bc34a;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>MiniClickr</h1>
  <button id="show">Show Controls</button>
  <div class="support">Free version</div>

  <script src="popup.js"></script>
</body>
</html>
